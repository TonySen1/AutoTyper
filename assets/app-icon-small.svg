<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!--
    AutoTyper 小尺寸变体（16 / 20 / 24 / 32 / 40 / 48）。
    和主图同语言，但只留“认得出”的部分：一枚键帽 + 两颗飞出字符 + 一道光标。
    细节（后两行文本、轨迹虚线、第三颗字符）在 48px 以下只会变成脏点，全部去掉。
  -->
  <defs>
    <linearGradient id="bg" x1="72" y1="24" x2="440" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2B45"/>
      <stop offset="0.52" stop-color="#0A101B"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="top" x1="96" y1="150" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9DEAFF"/>
      <stop offset="0.38" stop-color="#3C88EE"/>
      <stop offset="1" stop-color="#1B3D9C"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E86D2"/>
      <stop offset="0.30" stop-color="#1E3D6E"/>
      <stop offset="1" stop-color="#0A1424"/>
    </linearGradient>
    <linearGradient id="sheen" x1="104" y1="158" x2="300" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.40" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip1" x1="368" y1="236" x2="420" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FE4FF"/>
      <stop offset="1" stop-color="#5FB8FF"/>
    </linearGradient>
    <linearGradient id="chip2" x1="404" y1="176" x2="456" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B98CFF"/>
      <stop offset="1" stop-color="#FFC0F4"/>
    </linearGradient>
    <clipPath id="topClip">
      <path d="M140 140 H300 A40 40 0 0 1 340 180 V318 A40 40 0 0 1 300 358
               H140 A40 40 0 0 1 100 318 V180 A40 40 0 0 1 140 140 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- 侧壁：底边 + 右侧边，厚度 30（小尺寸要更夸张才看得见） -->
  <path d="M340 180 V358 H140 L140 392 H300 A40 40 0 0 0 340 352 Z" fill="url(#skirt)"/>

  <g clip-path="url(#topClip)">
    <rect x="100" y="140" width="240" height="218" fill="url(#top)"/>
    <rect x="100" y="140" width="240" height="218" fill="url(#sheen)"/>
    <path d="M138 145 H302" stroke="#FFFFFF" stroke-opacity="0.66"
          stroke-width="5" stroke-linecap="round"/>

    <!-- 一行字符格 + 光标 -->
    <g fill="#03101E" opacity="0.6">
      <rect x="126" y="188" width="42" height="34" rx="11"/>
      <rect x="182" y="188" width="42" height="34" rx="11"/>
      <rect x="238" y="188" width="42" height="34" rx="11"/>
    </g>
    <rect x="292" y="186" width="18" height="38" rx="8" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- 两颗飞出字符：尺寸递减、青转紫 -->
  <rect x="366" y="212" width="54" height="54" rx="16" fill="url(#chip1)"
        transform="rotate(-12 393 239)"/>
  <rect x="410" y="152" width="38" height="38" rx="12" fill="url(#chip2)"
        transform="rotate(-12 429 171)"/>
</svg>
